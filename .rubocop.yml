---
AllCops:
  Exclude:
  - "**/node_modules/**/*"
  - "**/vendor/**/*"
  - "**/db/schema.rb"
  - tmp/**/*
  NewCops: enable
  TargetRubyVersion: 4.0
Layout:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Enabled: false
Lint/EmptyClass:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Lint/PercentStringArray:
  Enabled: false
Lint/SafeNavigationChain:
  Enabled: false
Lint/ShadowingOuterLocalVariable:
  Enabled: false
Lint/SuppressedException:
  Enabled: false
Lint/UnusedBlockArgument:
  Enabled: false
Lint/UselessAssignment:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CollectionLiteralLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Naming/FileName:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Naming/PredicateMethod:
  Enabled: false
Naming/VariableNumber:
  Enabled: false
Performance/Sum:
  Enabled: false
Performance/UnfreezeString:
  Enabled: false
Rails/BulkChangeTable:
  Enabled: false
Rails/Delegate:
  Enabled: false
Rails/DynamicFindBy:
  Enabled: false
Rails/HelperInstanceVariable:
  Enabled: false
Rails/NegateInclude:
  Enabled: false
Rails/Output:
  Enabled: false
Rails/Presence:
  Enabled: false
Rails/Present:
  Enabled: false
Rails/SkipsModelValidations:
  Enabled: false
Rails/ThreeStateBooleanColumn:
  Enabled: false
Rails/TimeZone:
  Enabled: false
Rails/UnknownEnv:
  Environments:
  - development
  - test
  - staging
  - production
Security/Eval:
  Enabled: false
Style:
  Enabled: false
plugins:
- rubocop-performance
- rubocop-rails
- rubocop-rake
- rubocop-capybara
